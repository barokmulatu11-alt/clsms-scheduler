# Server Configuration
server.port=8080
spring.application.name=classroom-laboratory-scheduling

# Start with no data. Set to true to load the PRD sample rooms, instructors and courses.
clsms.load-sample-data=false

# Reject 2.5 for a whole-number field instead of silently turning it into 2
spring.jackson.deserialization.accept-float-as-int=false
